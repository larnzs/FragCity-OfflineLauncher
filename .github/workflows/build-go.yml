name: Build Go launcher (Windows x64)

on:
  push:
    branches: [ "rewrite/go-native" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test Go packages
        working-directory: goapp
        run: go test ./...

      - name: Build one self-contained Windows executable
        working-directory: goapp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-s -w" -o dist/FragCity-OfflineLauncher.exe .

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FragCity-OfflineLauncher-Go-win-x64
          path: goapp/dist/FragCity-OfflineLauncher.exe
          if-no-files-found: error
